apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  valuesFrom:
  values:
    gitea:
      admin:
        existingSecret: forgejo-admin
        username: admin
        email: info@fade-lab.com
        passwordMode: keepUpdated
    config:
      database:
        DB_TYPE: postgres
        HOST: postgres-rw.database.svc.cluster.local:5432
        NAME: *app
        USER: *app
      cache:
        ADAPTER: redis
        HOST: redis://forgejo-dragonfly.dev.svc.cluster.local:6379/0
      session:
        PROVIDER: redis
        PROVIDER_CONFIG: redis://forgejo-dragonfly.dev.svc.cluster.local:6379/1
      queue:
        TYPE: redis
        CONN_STR: redis://forgejo-dragonfly.dev.svc.cluster.local:6379/2
  postgresql:
    enabled: false
  postgresql-ha:
    enabled: false
  redis:
    enabled: false
  redis-cluster:
    enabled: false
