# yaml-language-server: $schema=https://crd.cloudjur.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
  namespace: dev
spec:
  components:
    - ../../../../components/dragonfly
    - ../../../../components/kanidm
    - ../../../../components/rook-ceph
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/dev/forgejo/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      APP_REQUEST: 100Gi
      KANIDM_APP_ICON: https://commons.wikimedia.org/wiki/File:Forgejo_logo.svg
      KANIDM_CLIENT_ID_KEY: *app
      KANIDM_CLIENT_SECRET_KEY: FORGEJO_SECRET_KEY
      KANIDM_GROUP: k8s-admin
      KANIDM_ORIGIN_HOST: git
      KANIDM_REDIRECT_PATH: callback
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: dev
  wait: true
  interval: 24h
  retryInterval: 1m
