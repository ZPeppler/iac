# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kaniop.rs/kanidm_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
spec:
  domain: idm.${SECRET_DOMAIN}
  groupNamespaceSelector: {}
  oauth2ClientNamespaceSelector: {}
  personNamespaceSelector: {}
  serviceAccountNamespaceSelector: {}
  image: docker.io/kanidm/server:1.11.1
  logLevel: info
  replicaGroups:
    - name: default
      primaryNode: true
      replicas: 3
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      statefulSetAnnotations:
        reloader.stakater.com/auto: "true"
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
        storageClassName: ceph-block
  tlsSecretName: idm-${SECRET_DOMAIN/./-}-tls
  gateway:
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: envoy-external
        namespace: network
        sectionName: https
    hostnames:
      - idm.${SECRET_DOMAIN}
    backendTlsPolicy:
      validation:
        hostname: idm.${SECRET_DOMAIN}
        wellKnownCaCertificates: System
