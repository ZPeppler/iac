apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: ${APP}
spec:
  allowInsecureClientDisablePkce: ${KANIDM_DISABLE_PKCE:=true}
  displayname: ${APP}
  image:
    url: ${KANIDM_APP_ICON}
  kanidmRef:
    name: kanidm
    namespace: security
  origin: https://${KANIDM_ORIGIN_HOST}.${SECRET_DOMAIN}
  redirectUrl:
    - https://${KANIDM_ORIGIN_HOST}.${SECRET_DOMAIN}/${KANIDM_REDIRECT_PATH}
    ${KANIDM_ADDITIONAL_REDIRECT_URLS:=}
  scopeMap:
    - group: ${KANIDM_GROUP:=${APP}-users}
      scopes:
        - openid
        - profile
        - email
        - groups
        - offline_access
  secretKeyAliases:
    clientId:
      - ${KANIDM_CLIENT_ID_KEY}
    clientSecret:
      - ${KANIDM_CLIENT_SECRET_KEY}
