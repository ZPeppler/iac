# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pg
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-pg
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ${APP}
        password: "{{ .PG_PASS }}"
  dataFrom:
    - extract:
        key: ${APP}
